<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Admin Portal — B. Akash Pandi</title>
  <meta http-equiv="refresh" content="0; url=../admin.html" />
  <script>
    // Seamless immediate redirect to admin.html preserving query params and hash
    var target = '../admin.html' + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    body {
      background: #08080D;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 23, 68, 0.2);
      border-top-color: #FF1744;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #FF1744; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Opening Admin Command Center...</p>
    <p><a href="../admin.html">Click here if you are not redirected automatically</a></p>
  </div>
</body>
</html>
