<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — B. Akash Pandi Portfolio</title>
  <script>
    (function() {
      var pathname = window.location.pathname.toLowerCase();
      var repoBase = '/akash-pandi-portfolio';
      
      // If visited /admin or /admin/
      if (pathname.indexOf('/admin') !== -1) {
        window.location.replace(repoBase + '/admin.html' + window.location.search + window.location.hash);
        return;
      }
      
      // Fallback to portfolio root
      window.location.replace(repoBase + '/' + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    body {
      background: #08080D;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 23, 68, 0.2);
      border-top-color: #FF1744;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #FF1744; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Navigating to destination...</p>
    <p><a href="./">Click here to return to Portfolio</a></p>
  </div>
</body>
</html>
